name: release

# Push a tag v<version> matching debian/changelog (e.g. v1.1.6-1): this builds the
# deb with build.sh and publishes it as the release of that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  UPSTREAM_NAME: sched-ext/scx-loader
  UPSTREAM_URL: https://github.com/sched-ext/scx-loader

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against debian/changelog
        id: version
        run: |
          version="$(sed -n '1s/^[^ ]* (\([^)]*\)).*/\1/p' debian/changelog)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match debian/changelog version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "upstream=${version%-*}" >>"$GITHUB_OUTPUT"

      # The Rust build needs more room than the runner has free by default
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Build
        run: ./build.sh

      - name: Release notes
        env:
          UPSTREAM: ${{ steps.version.outputs.upstream }}
        run: |
          {
            echo "Built from [$UPSTREAM_NAME v$UPSTREAM]($UPSTREAM_URL/releases/tag/v$UPSTREAM) for Debian 13 (trixie) amd64."
            echo
            # The first changelog entry, "  * x" -> "- x", continuation lines indented
            awk 'NR > 1 && /^ -- / { exit }
                 NR > 1 && /^  [*] / { sub(/^  [*] /, "- "); print; next }
                 NR > 1 && /^    / { sub(/^ +/, "  "); print }' debian/changelog
          } >notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deb="out/${GITHUB_REPOSITORY#*/}_${VERSION}_amd64.deb"
          test -f "$deb"
          sha256sum "$deb"
          gh release create "$GITHUB_REF_NAME" "$deb" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
